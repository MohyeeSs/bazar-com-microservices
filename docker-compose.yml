
services:
  catalog-service:
    build:
      context: ./CatalogService
      dockerfile: Dockerfile
    container_name: bazar-catalog
    environment:
      ASPNETCORE_URLS: http://+:8080
    volumes:
      - catalog-data:/app/Data
    expose:
      - "8080"

  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: bazar-order
    environment:
      ASPNETCORE_URLS: http://+:8080
      CatalogService__BaseUrl: http://catalog-service:8080/
    volumes:
      - order-data:/app/Data
    depends_on:
      - catalog-service
    expose:
      - "8080"

  frontend-service:
    build:
      context: ./FrontendService
      dockerfile: Dockerfile
    container_name: bazar-frontend
    environment:
      ASPNETCORE_URLS: http://+:8080
      CatalogService__BaseUrl: http://catalog-service:8080/
      OrderService__BaseUrl: http://order-service:8080/
    ports:
      - "5001:8080"
    depends_on:
      - catalog-service
      - order-service

volumes:
  catalog-data:
  order-data:
